version: 2
project_name: redmine-cli
dist: dist/goreleaser
builds:
  - main: ./cmd/redmine-cli
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/jkraemer/redmine-cli/internal/commands.buildVersion={{.Version}}
      - -X github.com/jkraemer/redmine-cli/internal/commands.buildCommit={{.ShortCommit}}
      - -X github.com/jkraemer/redmine-cli/internal/commands.buildDate={{.Date}}
archives:
  - files:
      - LICENSE
      - README.md
      - src: skills/redmine-cli/SKILL.md
        dst: SKILL.md
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
release:
  github:
    owner: jkraemer
    name: redmine-cli
