name: ci
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redmine: ["5.1", "6.1", "7.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: e2e against redmine ${{ matrix.redmine }}
        run: scripts/live/run.sh ${{ matrix.redmine }}
